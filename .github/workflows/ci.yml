name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Ground rules Phase 3 item 16: app/processor/cerbos/spring-boot-restless-test build down
      # to Java 17; example stays on 25 (it's not shipped, free to use newer syntax). 25 is the
      # only leg that can build example at all - a JDK 17/21 javac can't target a --release newer
      # than the JDK actually running it, for reasons unrelated to whether the library modules
      # themselves are Java-17/21 compatible - so the 17/21 legs build only the library modules.
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # Docker is preinstalled on ubuntu-latest runners - needed for the cerbos
      # module's Testcontainers-backed tests and example's Cerbos-backed suite
      # (a real Cerbos PDP is started per test class, see CerbosBackedTest).
      - name: Build and run the full reactor
        if: matrix.java == '25'
        run: ./mvnw -B -ntp verify

      - name: Build and run the library modules only
        if: matrix.java != '25'
        run: ./mvnw -B -ntp -pl processor,app,cerbos,spring-boot-restless-test -am verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  test-postgres:
    name: example against real PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Ground rules Phase 3 item 17: excludedGroups=postgres in example's own pom keeps every
      # other job's H2-backed run from paying for this - -Dgroups=postgres overrides that here to
      # run exactly DepartmentPostgresCudTest (a real Testcontainers Postgres, not H2's emulation
      # of one) against the LIKE-wildcard-escaping/collation/null-ordering differences H2 papers
      # over. -am: processor/app/cerbos need to be installed into the local repo first, same as
      # the main job's reactor build.
      - name: Build processor/app/cerbos, then run example's postgres-tagged tests
        run: ./mvnw -B -ntp -pl example -am install -DskipTests
          && ./mvnw -B -ntp -pl example test -Dgroups=postgres

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-postgres
          path: 'example/target/surefire-reports/**'
          retention-days: 7
