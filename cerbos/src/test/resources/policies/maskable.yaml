---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: maskable
  rules:
    # admin: unconditional, unmasked access - exercises postProcessResponse's "no matching rule
    # output at all" branch (CerbosFieldMasker already fails open on that - see its own javadoc -
    # since it's a field-level refinement, not a replacement for the row-level grant).
    - actions: ["read_one"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # limited: allowed to read, but the "name" field is masked via a policy output - proves
    # CerbosAuthorizationGuard.postProcessResponse automatically applies it without any
    # hand-written Mapper calling CerbosFieldMasker itself.
    - actions: ["read_one"]
      effect: EFFECT_ALLOW
      roles: ["limited"]
      output:
        when:
          ruleActivated: '["name"]'
