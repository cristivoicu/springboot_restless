spring.application.name=spring-boot-restless-example
spring.jpa.hibernate.ddl-auto=update

# Cerbos PDP this app's CerbosAuthorizationGuard beans talk to. Point it at a real instance
# started with this module's src/main/resources/policies/ directory, e.g.:
#   docker run -p 3593:3593 -v $(pwd)/example/src/main/resources/policies:/policies cerbos/cerbos:latest
cerbos.client.target=localhost:3593

# Demo-only HS256 secret backing SecurityConfig's JwtDecoder - swap for a real
# spring.security.oauth2.resourceserver.jwt.issuer-uri/jwk-set-uri pointing at a real IdP instead.
cerbos.demo.jwt.secret=please-change-this-demo-only-secret-key-1234567890
