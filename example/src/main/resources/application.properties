spring.application.name=spring-boot-restless-example
spring.jpa.hibernate.ddl-auto=update
server.port=8081

# Off, not Boot's own "true" default: Open Session In View papers over exactly the lazy-loading
# bug RestlessResourceHandler#inReadOnlyTransaction now exists to fix for real (see its javadoc) -
# running with it off here is what actually proves that fix works, rather than never exercising
# the failure mode at all. This is also the generally-recommended production setting regardless
# (OSIV's own tradeoff - a lazy fetch anywhere in the view layer silently issuing an extra query
# outside any explicit transaction - is exactly what turning it off catches at the framework
# boundary instead of silently allowing).
spring.jpa.open-in-view=false

# ProjectAssignment's bulk-create path does one saveAll() per request (see its
# CreateDataSource#createAll override) instead of N individual save() calls - these settings are
# what actually turns that into batched JDBC INSERTs (grouped into round trips of batch_size rows)
# rather than N individual ones; order_inserts lets Hibernate group same-table inserts together
# even when the request also touches other tables first.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Cerbos PDP + Keycloak IAM this app talks to - see docker-compose.yml at the repo root
# (`docker compose up -d`) and docker/keycloak/README.md for the demo accounts.
cerbos.client.target=localhost:3593
cerbos.client.timeout=3s
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/restless-demo

# /actuator/health shows the individual CerbosHealthIndicator contributor (cerbos module) -
# "always" rather than the "when-authorized" default so it's visible without a management-role
# principal, since this is a demo app with no such role modeled at all.
management.endpoint.health.show-details=always

# Spring Boot only exposes /actuator/health over HTTP by default - "metrics" added so
# /actuator/metrics/restless.authorization.denials (RestlessAuthorizationMetrics, app module) is
# actually reachable, not just registered in the MeterRegistry.
management.endpoints.web.exposure.include=health,metrics
