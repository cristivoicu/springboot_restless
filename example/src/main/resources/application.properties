spring.application.name=spring-boot-restless-example
spring.jpa.hibernate.ddl-auto=update

# Cerbos PDP + Keycloak IAM this app talks to - see docker-compose.yml at the repo root
# (`docker compose up -d`) and docker/keycloak/README.md for the demo accounts.
cerbos.client.target=localhost:3593
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/restless-demo
