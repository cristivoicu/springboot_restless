---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: employee
  rules:
    # admin: unconditional access to everything.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # manager: may always create, but read/update/delete only the employees whose lastName
    # matches their own "scopedLastName" claim - the same semantics the old header-based demo
    # guard had (X-Scope-LastName), now expressed as a real policy instead of hand-rolled code.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["manager"]

    # Note the "!has(...) ||" guard: CerbosAuthorizationGuard.preCheck() (the coarse "can this
    # principal even attempt this action" gate, called before any entity is loaded) checks against
    # a synthetic resource with NO attributes at all - request.resource.attr.lastName is simply
    # unset there. Without the has() guard, that would make this condition false and preCheck deny
    # the attempt outright for every manager, before scope()/canAccess() ever get a chance to do
    # the real per-row restriction. has() lets the attribute-less coarse check pass through
    # unconditionally, while canAccess()/scope() - which always run with real attributes present -
    # still evaluate the actual equality.
    - actions:
        - read_one
        - read_list
        - read_page
        - read_page_overview
        - read_page_select
        - update
        - delete_one
        - delete_all
        - byEmailDomain
      effect: EFFECT_ALLOW
      roles: ["manager"]
      condition:
        match:
          expr: >
            !has(request.resource.attr.lastName) ||
            request.resource.attr.lastName == request.principal.attr.scopedLastName

    # employee: read-only "company directory" access - unlike manager (scoped to their own
    # reports via scopedLastName above), a plain employee can look up any colleague's record but
    # never write one. This is what makes GET /employees/{id}?expand=projects,department
    # reachable for an "employee" principal at all (see EmployeeEmbedTest) - the row-scoping that
    # differs by relation happens one level down, inside the embedded project/department reads
    # themselves (policies/project.yaml/department.yaml), not here.
    - actions:
        - read_one
        - read_list
        - read_page
        - read_page_overview
        - read_page_select
      effect: EFFECT_ALLOW
      roles: ["employee"]

    # "view" isn't one of AuthorizationGuard's CRUD actions - EmployeeMapper checks it
    # separately, purely to read back the output below (see CerbosFieldMasker). It's not a
    # substitute for the row-level rule above: a manager only ever reaches this check for a
    # row they were already allowed to read/update/delete. Field-level masking, not access
    # control - role AND attribute in one place: the role ("manager") gates whether this rule
    # applies at all, the "canViewSalary" attribute decides what its output hides.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["manager"]
      output:
        when:
          ruleActivated: |-
            request.principal.attr.canViewSalary == true ? [] : ["salary"]

    # A plain employee's "view" rule always hides salary - no canViewSalary escape hatch at all,
    # unlike manager above. Without this rule, CerbosFieldMasker's fail-open-on-no-match behavior
    # (see its own javadoc) would leave salary fully unmasked for the "employee" role the moment
    # the read-only rule above started granting it access to other employees' records at all.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["employee"]
      output:
        when:
          ruleActivated: "['salary']"

    # "contact" - the named-view demo (GET /employees/{id}/contact): a manager may view any
    # employee's contact card, but only when the resource's own "initials" attribute matches an
    # "expectedInitials" claim on their own JWT. "initials" is computed on EmployeeContactDto, not
    # a column on the employee table at all (see EmployeeRestlessResource#getAuthorizationGuard,
    # CerbosDtoResourceAttributesMapper) - this rule is the proof a DTO-only attribute genuinely
    # reaches the PDP, not just entity columns. Same !has() guard as the manager row-scoping rule
    # above, same reason: preCheck's synthetic resource carries no attributes yet.
    - actions: ["contact"]
      effect: EFFECT_ALLOW
      roles: ["manager"]
      condition:
        match:
          expr: >
            !has(request.resource.attr.initials) ||
            request.resource.attr.initials == request.principal.attr.expectedInitials
